      - name: Test remote recognition evidence
        run: |
          cd ZY_Assistant_Android_V3
          mkdir -p /tmp/zy_test
          javac -d /tmp/zy_test app/src/main/java/com/zycmzc/assistant/RegionEvidence.java RegionEvidenceTest.java
          java -cp /tmp/zy_test com.zycmzc.assistant.RegionEvidenceTest
      - name: Build V5 SafeStart debug APK
        run: gradle --project-dir ZY_Assistant_Android_V3 :app:assembleDebug --stacktrace --no-daemon
      - name: Upload V5 SafeStart APK
        uses: actions/upload-artifact@v4
        with:
          name: ZY-Assistant-V5-SafeStart-debug-apk
          path: ZY_Assistant_Android_V3/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
