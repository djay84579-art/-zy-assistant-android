name: ZY V5 SafeStart One-File Fix

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build_zy_v5_onefile.yml'
      - 'ZY_Assistant_Android_V4.zip'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract existing V4 source
        run: |
          unzip -oq ZY_Assistant_Android_V4.zip
          test -f ZY_Assistant_Android_V3/app/build.gradle
      - name: Apply tested V5 SafeStart Java fixes
        shell: bash
