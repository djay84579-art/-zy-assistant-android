name: ZY V7 Only - Build and Clean Old Versions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'ZY_Assistant_Android_V7_Roboflow.zip'

permissions:
  contents: write

jobs:
  build-v7-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract standalone V7 project
        run: |
          test -f ZY_Assistant_Android_V7_Roboflow.zip
          unzip -oq ZY_Assistant_Android_V7_Roboflow.zip
          test -f ZY_Assistant_Android_V7_Roboflow/app/build.gradle
      - name: Check person detection logic
        run: |
          mkdir -p /tmp/zyv7-test
          javac -d /tmp/zyv7-test \
            ZY_Assistant_Android_V7_Roboflow/app/src/main/java/com/zycmzc/assistant/RegionEvidence.java \
            ZY_Assistant_Android_V7_Roboflow/RegionEvidenceTest.java
          java -cp /tmp/zyv7-test com.zycmzc.assistant.RegionEvidenceTest
      - name: Build V7 APK
        run: gradle --project-dir ZY_Assistant_Android_V7_Roboflow :app:assembleDebug --stacktrace --no-daemon
      - name: Upload V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ZY-Assistant-V7-Roboflow-APK
          path: ZY_Assistant_Android_V7_Roboflow/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Delete obsolete archives from GitHub
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in \
            ZY_Assistant_Android_V3.zip \
            ZY_Assistant_Android_V4.zip \
            ZY_Assistant_Android_V6_Cloud.zip \
            build_zy_v5_onefile.yml; do
            if [ -f "$file" ]; then
              git rm -- "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Remove obsolete versions; keep standalone V7'
            git push origin HEAD:main
          else
            echo 'No old versions remain.'
          fi
