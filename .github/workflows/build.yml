name: ZY V8 FastPose APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - 'ZY_Assistant_V8_FastPose.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract V8 FastPose project
        run: |
          unzip -oq ZY_Assistant_V8_FastPose.zip
          test -f ZY_Assistant_V8_FastPose/app/build.gradle
      - name: Download two official on-device AI models
        run: |
          set -euo pipefail
          ASSETS=ZY_Assistant_V8_FastPose/app/src/main/assets
          mkdir -p "$ASSETS"
          curl --fail --location --retry 4 --max-time 180 \
            'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite' \
            -o "$ASSETS/efficientdet_lite0_int8.tflite"
          curl --fail --location --retry 4 --max-time 180 \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' \
            -o "$ASSETS/pose_landmarker_lite.task"
          python3 - <<'PYMODEL'
          from pathlib import Path
          base=Path('ZY_Assistant_V8_FastPose/app/src/main/assets')
          d=(base/'efficientdet_lite0_int8.tflite').read_bytes()
          p=(base/'pose_landmarker_lite.task').read_bytes()
          assert len(d)>100_000 and d[4:8]==b'TFL3', 'Invalid detector model'
          assert len(p)>100_000 and p[:2]==b'PK', 'Invalid pose model bundle'
          print('Models validated:',len(d),len(p))
          PYMODEL
      - name: Check source and temporal confirmation
        run: |
          mkdir -p /tmp/zy-v8-test
          javac -d /tmp/zy-v8-test \
            ZY_Assistant_V8_FastPose/app/src/main/java/com/zycmzc/assistant/RegionEvidence.java \
            ZY_Assistant_V8_FastPose/RegionEvidenceTest.java
          java -cp /tmp/zy-v8-test com.zycmzc.assistant.RegionEvidenceTest
          ! grep -R 'ZY辅助·离线' ZY_Assistant_V8_FastPose/app/src/main/java
      - name: Compile V8 APK
        run: gradle --project-dir ZY_Assistant_V8_FastPose :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZY-Assistant-V8-FastPose-APK
          path: ZY_Assistant_V8_FastPose/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  cleanup_old_versions:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete superseded ZIP archives after successful V8 build
        shell: bash
        run: |
          set -euo pipefail
          test -f ZY_Assistant_V8_FastPose.zip
          git rm -f --ignore-unmatch -- \
            ZY_Assistant_Android_V7_Roboflow.zip \
            ZY_Assistant_Android_V8_Offline.zip
          if git diff --cached --quiet; then
            echo 'No old archives remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep only V8 FastPose release source'
          git push origin "HEAD:${GITHUB_REF_NAME}"
