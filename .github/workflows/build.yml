name: Build ZY Native APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ZY_Assistant_Android_V3.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract source
        run: unzip -q -o ZY_Assistant_Android_V3.zip
      - name: Build debug APK
        working-directory: ZY_Assistant_Android_V3
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZY-assistant-debug-apk
          path: ZY_Assistant_Android_V3/app/build/outputs/apk/debug/app-debug.apk
