name: ZY V8 FastPose APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build_zy_v8_fast_pose_onefile.yml'
      - 'ZY_Assistant_Android_V7_Roboflow.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract existing V7 base project
        run: |
          test -f ZY_Assistant_Android_V7_Roboflow.zip
          unzip -oq ZY_Assistant_Android_V7_Roboflow.zip
          mv ZY_Assistant_Android_V7_Roboflow ZY_Assistant_V8_FastPose
          rm -f ZY_Assistant_V8_FastPose/app/src/main/java/com/zycmzc/assistant/CloudDetectorClient.java
          rm -f ZY_Assistant_V8_FastPose/app/src/main/java/com/zycmzc/assistant/RoboflowKeyStore.java
      - name: Apply V8 FastPose model and UI patch
