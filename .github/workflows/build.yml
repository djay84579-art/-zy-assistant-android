
name: Build ZY Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ZY_Assistant_Android_V3.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Build ZY APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZY project
        run: |
          unzip -q -o ZY_Assistant_Android_V3.zip
          test -f ZY_Assistant_Android_V3/app/build.gradle

      - name: Build ZY debug APK
        working-directory: ZY_Assistant_Android_V3
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload ZY APK
        uses: actions/upload-artifact@v4
        with:
          name: ZY-assistant-debug-apk
          path: ZY_Assistant_Android_V3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
