      - name: Download official local AI models
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=ZY_Assistant_V9_FinalHands/app/src/main/assets
          mkdir -p "$ASSETS"
          curl -fL --retry 4 --max-time 180 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite' -o "$ASSETS/efficientdet_lite0_int8.tflite"
          curl -fL --retry 4 --max-time 180 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' -o "$ASSETS/pose_landmarker_lite.task"
          curl -fL --retry 4 --max-time 180 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' -o "$ASSETS/hand_landmarker.task"
          python3 - <<'PYMODEL'
          from pathlib import Path
          import hashlib
          base=Path('ZY_Assistant_V9_FinalHands/app/src/main/assets')
          bounds={'efficientdet_lite0_int8.tflite':(100_000,30_000_000),'pose_landmarker_lite.task':(1_000_000,30_000_000),'hand_landmarker.task':(1_000_000,30_000_000)}
          for name,(lo,hi) in bounds.items():
              data=(base/name).read_bytes()
              assert lo<len(data)<hi, f'Invalid size: {name}'
              assert not data.lstrip().startswith((b'<',b'{')), f'Error page instead of model: {name}'
              if name.endswith('.tflite'): assert data[4:8]==b'TFL3', name
              print(name,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest())
          PYMODEL
      - name: Run stability and multi-hand geometry tests
        run: |
