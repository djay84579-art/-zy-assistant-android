      - name: Download official on-device detection, pose and hand models
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=ZY_Assistant_V8_StableHands/app/src/main/assets
          mkdir -p "$ASSETS"
          curl --fail --location --retry 4 --max-time 180 \
            'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite' \
            -o "$ASSETS/efficientdet_lite0_int8.tflite"
          curl --fail --location --retry 4 --max-time 180 \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' \
            -o "$ASSETS/pose_landmarker_lite.task"
          curl --fail --location --retry 4 --max-time 180 \
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' \
            -o "$ASSETS/hand_landmarker.task"
          python3 - <<'PYMODEL'
          from pathlib import Path
          import hashlib
          files = {
            'efficientdet_lite0_int8.tflite': (100_000,30_000_000),
            'pose_landmarker_lite.task': (1_000_000,30_000_000),
            'hand_landmarker.task': (1_000_000,30_000_000),
          }
          base = Path('ZY_Assistant_V8_StableHands/app/src/main/assets')
          for name,(minimum,maximum) in files.items():
              contents=(base/name).read_bytes()
              assert minimum < len(contents) < maximum, f'Unexpected model size: {name} ({len(contents)})'
              assert not contents.lstrip().startswith((b'<',b'{')), f'Downloaded an error page: {name}'
              if name.endswith('.tflite'):
                  assert contents[4:8]==b'TFL3','Invalid tflite header'
              print(name, len(contents), 'SHA256:', hashlib.sha256(contents).hexdigest())
          PYMODEL
      - name: Test stable tracking and temporal person confirmation
        run: |
          set -e
          mkdir -p /tmp/zytest
          javac -d /tmp/zytest \
            ZY_Assistant_V8_StableHands/app/src/main/java/com/zycmzc/assistant/StableSkeletons.java \
            ZY_Assistant_V8_StableHands/StableSkeletonsTest.java \
            ZY_Assistant_V8_StableHands/app/src/main/java/com/zycmzc/assistant/RegionEvidence.java \
            ZY_Assistant_V8_StableHands/RegionEvidenceTest.java
          java -cp /tmp/zytest com.zycmzc.assistant.StableSkeletonsTest
          java -cp /tmp/zytest com.zycmzc.assistant.RegionEvidenceTest
      - name: Build Android APK
        run: gradle --project-dir ZY_Assistant_V8_StableHands :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZY-Assistant-V8.1-StableHands-debug-apk
          path: ZY_Assistant_V8_StableHands/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
