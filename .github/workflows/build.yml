          javac -d /tmp/zy_v9_test app/src/main/java/com/zycmzc/assistant/PianoKeys.java app/src/main/java/com/zycmzc/assistant/PianoTrigger.java app/src/main/java/com/zycmzc/assistant/PianoWave.java PianoTest.java app/src/main/java/com/zycmzc/assistant/CameraProfiles.java app/src/main/java/com/zycmzc/assistant/FrameCrop.java CameraAdaptationTest.java TrackingStabilityTest.java app/src/main/java/com/zycmzc/assistant/BodyEvidence.java BodyEvidenceTest.java app/src/main/java/com/zycmzc/assistant/StableSkeletons.java StableSkeletonsTest.java app/src/main/java/com/zycmzc/assistant/HandRoiPlanner.java HandRoiPlannerTest.java app/src/main/java/com/zycmzc/assistant/RegionEvidence.java RegionEvidenceTest.java
