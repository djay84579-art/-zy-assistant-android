name: ZY V6 Cloud Bridge APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build_zy_v6_cloud.yml'
      - 'ZY_Assistant_Android_V4.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract existing V4 source
        shell: bash
        run: |
          unzip -oq ZY_Assistant_Android_V4.zip
          test -f ZY_Assistant_Android_V3/app/build.gradle
      - name: Apply V6 cloud bridge patch (no secrets)
