name: ZY V4 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Find V4 source
        shell: bash
        run: |
          if [ -f ZY_Assistant_Android_V4.zip ]; then
            unzip -oq ZY_Assistant_Android_V4.zip
          fi
          if [ -f ZY_Assistant_Android_V3/app/build.gradle ]; then
            echo 'PROJECT_DIR=ZY_Assistant_Android_V3' >> "$GITHUB_ENV"
          elif [ -f app/build.gradle ]; then
            echo 'PROJECT_DIR=.' >> "$GITHUB_ENV"
          else
            echo 'Cannot find Android project' >&2
            exit 1
          fi
      - name: Build debug APK with offline AI assets
        run: gradle --project-dir "$PROJECT_DIR" assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZY-Assistant-V4-debug-apk
          path: |
            ZY_Assistant_Android_V3/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
