      - name: Download two official on-device AI models
        run: |
          set -euo pipefail
          ASSETS=ZY_Assistant_V8_FastPose/app/src/main/assets
          mkdir -p "$ASSETS"
          curl --fail --location --retry 4 --max-time 180 \
            'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite' \
            -o "$ASSETS/efficientdet_lite0_int8.tflite"
          curl --fail --location --retry 4 --max-time 180 \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' \
            -o "$ASSETS/pose_landmarker_lite.task"
          python3 - <<'PYMODEL'
          from pathlib import Path
          base=Path('ZY_Assistant_V8_FastPose/app/src/main/assets')
          d=(base/'efficientdet_lite0_int8.tflite').read_bytes()
          p=(base/'pose_landmarker_lite.task').read_bytes()
          assert len(d)>100_000 and d[4:8]==b'TFL3', 'Invalid detector model'
          assert len(p)>100_000 and p[:2]==b'PK', 'Invalid pose model bundle'
          print('Models validated:',len(d),len(p))
          PYMODEL
