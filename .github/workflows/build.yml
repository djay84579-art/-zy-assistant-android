name: ZY V8.1 Stable Skeletons + Hands
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build_zy_v81_stable_hands_onefile.yml'
      - '.github/workflows/build.yml'
      - 'ZY_Assistant_V8_FastPose.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract existing base FastPose archive
        run: |
          test -f ZY_Assistant_V8_FastPose.zip
          unzip -oq ZY_Assistant_V8_FastPose.zip
          test -f ZY_Assistant_V8_FastPose/app/build.gradle
          mv ZY_Assistant_V8_FastPose ZY_Assistant_V8_StableHands
