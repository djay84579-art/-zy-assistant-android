      - name: Download official on-device AI models
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=ZY_Assistant_V82_LowLatency/app/src/main/assets
          mkdir -p "$ASSETS"
          curl --fail --location --retry 4 --max-time 180 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite' -o "$ASSETS/efficientdet_lite0_int8.tflite"
          curl --fail --location --retry 4 --max-time 180 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' -o "$ASSETS/pose_landmarker_lite.task"
          curl --fail --location --retry 4 --max-time 180 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' -o "$ASSETS/hand_landmarker.task"
          python3 - <<'PYMODEL'
          from pathlib import Path
          import hashlib
          base=Path('ZY_Assistant_V82_LowLatency/app/src/main/assets')
          bounds={'efficientdet_lite0_int8.tflite':(100_000,30_000_000),'pose_landmarker_lite.task':(1_000_000,30_000_000),'hand_landmarker.task':(1_000_000,30_000_000)}
          for name,(lo,hi) in bounds.items():
              content=(base/name).read_bytes()
              assert lo < len(content) < hi, f'Bad model size: {name}'
              assert not content.lstrip().startswith((b'<',b'{')), f'Error page downloaded: {name}'
              if name.endswith('.tflite'): assert content[4:8]==b'TFL3', f'Bad TFLite: {name}'
              print(name,len(content),'sha256',hashlib.sha256(content).hexdigest())
          PYMODEL
      - name: Test tracking and frame confirmation
        shell: bash
        run: |
          set -e
          cd ZY_Assistant_V82_LowLatency
          mkdir -p /tmp/zyv82test
          javac -d /tmp/zyv82test app/src/main/java/com/zycmzc/assistant/StableSkeletons.java StableSkeletonsTest.java app/src/main/java/com/zycmzc/assistant/RegionEvidence.java RegionEvidenceTest.java
          java -cp /tmp/zyv82test com.zycmzc.assistant.StableSkeletonsTest
          java -cp /tmp/zyv82test com.zycmzc.assistant.RegionEvidenceTest
      - name: Build APK
        run: gradle --project-dir ZY_Assistant_V82_LowLatency :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZY-Assistant-V8.2-LowLatency-StableHands-APK
          path: ZY_Assistant_V82_LowLatency/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
