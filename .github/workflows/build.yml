name: ZY V14 Camera Adaptation APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/build_zy_v9_final_onefile.yml'
      - 'ZY_Assistant_V8_FastPose.zip'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract existing V8 project
        run: |
          unzip -oq ZY_Assistant_V8_FastPose.zip
          test -f ZY_Assistant_V8_FastPose/app/build.gradle
          mv ZY_Assistant_V8_FastPose ZY_Assistant_V9_FinalHands
